limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=captcha:10m rate=30r/m;
server {
    listen 80;
    server_name _;
    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 105m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    location = /api/auth/login {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
    }
    location = /api/auth/captcha {
        limit_req zone=captcha burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_buffering off;
        proxy_cache off;
    }
    location = /healthz { proxy_pass http://backend:8000; }
    location = /readyz { proxy_pass http://backend:8000; }
    location / { try_files $uri $uri/ $uri.html =404; }
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
