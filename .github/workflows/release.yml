name: Publish release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --title "Apocalypse $TAG_NAME" --generate-notes --notes-file docs/RELEASE_NOTES.md
