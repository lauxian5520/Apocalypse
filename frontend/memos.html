<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>天启 Apocalypse | 笔记工作台</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components/floating-panel.css">
    <link rel="stylesheet" href="css/components/sprite-chat.css">
    <link rel="stylesheet" href="css/components/music-player.css">
    <link rel="stylesheet" href="css/pages/memos.css">
</head>

<body>
    <div id="canvas-container"></div>
    <div class="noise-overlay"></div>
    <header class="header">
        <nav class="nav">
            <div class="logo">天启</div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="memos.html" class="active">笔记</a></li>
                <li><a href="trending.html">热门项目</a></li>
                <li><a href="papers.html">前沿论文</a></li>
                <li><a href="focus.html">焦点新闻</a></li>
                <li><a href="tools.html">工具箱</a></li>
                <li><a href="harness.html">Harness</a></li>
                <li><a href="space.html">联系作者</a></li>
            </ul>
            <div class="nav-user" id="nav-user-area"></div>
            <div class="nav-toggle"><span></span><span></span><span></span></div>
        </nav>
    </header>

    <main class="page-layout">
        <div class="section-header">
            <div class="section-label">MEMOS</div>
            <h1 class="page-title">我的<span
                    style="background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent">知识空间</span>
            </h1>
        </div>

        <!-- Compose -->
        <div id="compose-area"></div>

        <!-- Memos list -->
        <div class="memo-toolbar">
            <div class="memo-visibility-filter">
                <label for="memo-filter">查看笔记</label>
                <select id="memo-filter" class="input"><option value="public">公开</option><option value="private">私密（作者和管理员可见，需登录）</option></select>
            </div>
            <form id="memo-search-form" class="memo-search-form" role="search" aria-label="搜索笔记">
                <label class="memo-search-field" for="memo-search">
                    <span>关键词搜索</span>
                    <span class="memo-search-input"><input id="memo-search" class="input" type="search" placeholder="搜索笔记内容…" maxlength="200" autocomplete="off"></span>
                </label>
                <button class="btn btn-primary btn-sm" type="submit">搜索</button>
                <button id="memo-search-clear" class="btn btn-sm" type="button" disabled>清空</button>
            </form>
        </div>
        <p id="memo-search-status" role="status" aria-live="polite"></p>
        <div id="memos-list"></div>
        <button class="btn" id="load-more-btn">加载更多…</button>
    </main>

    <div id="sprite-container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
    <script src="js/pages/memos.js"></script>
    <script src="js/widgets/floating-panel.js"></script>
    <script src="js/widgets/sprite-chat.js"></script>
    <script src="js/widgets/music-player.js"></script>
</body>

</html>
