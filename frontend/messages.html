<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>天启 Apocalypse | 私聊</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components/sprite-chat.css">
  <link rel="stylesheet" href="css/components/music-player.css">
    <link rel="stylesheet" href="css/pages/messages.css">
</head>

<body>
  <div id="canvas-container"></div>
  <div class="noise-overlay"></div>

  <header class="header">
    <nav class="nav">
      <div class="logo">天启</div>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="memos.html">笔记</a></li>
        <li><a href="messages.html" class="active">私聊</a></li>
        <li><a href="harness.html">Harness</a></li>
      </ul>
      <div class="nav-user" id="nav-user-area"></div>
      <div class="nav-toggle"><span></span><span></span><span></span></div>
    </nav>
  </header>

  <main class="page-wrap">
    <div class="chat-layout">
      <section class="glass-panel conv-list">
        <div class="section-label" style="padding:0.8rem 0.8rem 0">会话列表</div>
        <div id="conv-list"></div>
      </section>
      <section class="glass-panel chat-panel">
        <div class="section-label" style="padding:0.8rem 0.8rem 0" id="dm-peer-name">请选择一个会话</div>
        <div class="chat-messages" id="dm-messages"></div>
        <form class="chat-input-row" id="dm-form">
          <input class="input" id="dm-input" placeholder="输入消息..." maxlength="2000">
          <label class="btn btn-sm" for="dm-file">附件</label>
          <input type="file" id="dm-file" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md,.zip,.rar,.7z" style="display:none">
          <span class="dm-attach-hint" id="dm-file-hint">未选择附件</span>
          <button class="btn btn-primary" type="submit">发送</button>
        </form>
      </section>
    </div>
  </main>

  <div id="sprite-container"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/widgets/sprite-chat.js"></script>
  <script src="js/widgets/music-player.js"></script>
  <script src="js/pages/messages.js"></script>
</body>

</html>
