<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>天启 Apocalypse | 前沿论文速览</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components/floating-panel.css">
    <link rel="stylesheet" href="css/components/sprite-chat.css">
    <link rel="stylesheet" href="css/components/music-player.css">
    <link rel="stylesheet" href="css/pages/papers.css">
</head>

<body>
    <div id="canvas-container"></div>
    <div class="noise-overlay"></div>

    <header class="header">
        <nav class="nav">
            <div class="logo">天启</div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="memos.html">笔记</a></li>
                <li><a href="trending.html">热门项目</a></li>
                <li><a href="papers.html" class="active">前沿论文</a></li>
                <li><a href="focus.html">焦点新闻</a></li>
                <li><a href="tools.html">工具箱</a></li>
                <li><a href="harness.html">Harness</a></li>
                <li><a href="space.html">联系作者</a></li>
            </ul>
            <div class="nav-user" id="nav-user-area"></div>
            <div class="nav-toggle"><span></span><span></span><span></span></div>
        </nav>
    </header>

    <div class="page-wrap">
        <div class="section-header" style="text-align:left;padding-top:2rem;margin-bottom:1.2rem">
            <div class="section-label">AI RESEARCH</div>
            <h1 style="font-family:var(--font-display);font-size:2rem;font-weight:700">前沿<span
                    style="background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent">论文</span>
            </h1>
            <p class="section-desc">HuggingFace · ArXiv · 机器学习、视觉、自然语言处理与机器人顶会论文</p>
        </div>

        <div class="source-tabs" id="source-tabs">
            <button class="source-tab active" data-source="hf">🤗 HuggingFace</button>
            <button class="source-tab" data-source="arxiv">🎓 ArXiv 论文</button>
            <button class="source-tab" data-source="conferences">🏆 顶会论文</button>
        </div>

        <div id="conference-controls" hidden>
            <div class="conference-filters">
                <label>会议<select id="conference-venue">
                    <option value="all">全部会议</option>
                </select></label>
                <label>年份<select id="conference-year"></select></label>
                <label class="conference-search">搜索论文<input id="conference-query" type="search" maxlength="100" placeholder="标题或作者关键词"></label>
            </div>
            <div id="conference-areas" class="conference-areas" aria-label="研究领域"></div>
            <p class="conference-note">收录会议官方论文目录，按标题、官方主题与关键词归类；跨领域论文可出现在多个分类。默认展示上一年度，可切换年份；ICCV、ECCV 隔年举办，选择会议后自动调整可选年份。</p>
            <p id="conference-status" class="conference-note" role="status" aria-live="polite"></p>
        </div>
        
        <div class="filters" id="period-tabs" style="margin-bottom: 1.2rem; display: flex;">
            <span class="tag period-tab tag-active" data-period="daily">最新一期</span>
            <span class="tag period-tab" data-period="weekly">本周</span>
            <span class="tag period-tab" data-period="monthly">本月</span>
            <span class="tag period-tab" data-period="halfyear">近半年</span>
        </div>

        <div class="grid-3" id="papers-grid"></div>
        <button id="conference-more" class="btn" hidden>加载更多论文</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/pages/feeds.js"></script>
  <script src="js/widgets/floating-panel.js"></script>
  <script src="js/widgets/sprite-chat.js"></script>
    <script src="js/widgets/music-player.js"></script>
    <script src="js/pages/papers.js"></script>
</body>

</html>
